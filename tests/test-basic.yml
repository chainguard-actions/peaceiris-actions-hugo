name: Test basic usage (latest Hugo)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert Hugo is installed
        run: |
          echo "Checking Hugo installation..."
          if ! command -v hugo &>/dev/null; then
            echo "FAIL: hugo binary not found in PATH"
            exit 1
          fi
          VERSION=$(hugo version)
          echo "Hugo version: $VERSION"
          echo "PASS: Hugo is installed"
      - name: Assert Hugo can build
        run: |
          echo "Verifying Hugo can run..."
          hugo version
          echo "PASS: Hugo runs successfully"
