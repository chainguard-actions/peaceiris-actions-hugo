name: Daily Test

on:
  schedule:
    - cron: '13 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - 'ubuntu-20.04'
          - 'ubuntu-latest'
          - 'macos-latest'
          - 'windows-latest'
        hugo-version:
          - 'latest'
          - '0.61.0'
        extended:
          - true
          - false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@16361eb4acea8698b220b76c0d4e84e1fd22c61d # v2.6.0
        with:
          hugo-version: ${{ matrix.hugo-version }}
          extended: ${{ matrix.extended }}

      - name: Run hugo version
        run: echo "::set-output name=hugo_version::$(hugo version)"
        id: hugo_version

      - name: Print hugo version
        env:
          HUGO_VERSION: ${{ steps.hugo_version.outputs.hugo_version }}
        run: echo "$HUGO_VERSION"
